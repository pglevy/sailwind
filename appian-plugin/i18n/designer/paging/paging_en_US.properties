# Appian designer-translation bundle (default en_US) for the Paging component.
# Convention: Appian Component Plug-in internationalization bundle.
#   name / description               -> the component itself
#   parameter.<name>.name            -> parameter friendly name
#   parameter.<name>.description      -> parameter description
# See ../README.md for scope, key convention, and assumptions.

# Component
name=Paging
description=Displays pagination controls (previous/next, optional first/last, and a range indicator) for navigating a large data set one page at a time. Best paired with a Read-Only Grid or other paged content.

# Parameters
parameter.totalCount.name=Total Count
parameter.totalCount.description=Total number of items across all pages. Required. Used to compute the number of pages and the range indicator.

parameter.pageSize.name=Page Size
parameter.pageSize.description=Number of items shown per page. Required. Combined with Total Count to determine the page count.

parameter.currentPage.name=Current Page
parameter.currentPage.description=The currently displayed page number, 1-based. Required.

parameter.onPageChange.name=On Page Change
parameter.onPageChange.description=Event fired when the user selects a different page. Receives the new 1-based page number.

parameter.pagingControls.name=Paging Controls
parameter.pagingControls.description=Determines which controls appear. Optional; default "STANDARD". Valid values: "STANDARD" (previous/next only, hides total count) and "ROW_COUNT" (also shows the total count and first/last controls).

parameter.showWhen.name=Show When
parameter.showWhen.description=Whether the component is displayed. Optional; default true. When false, the component renders nothing.
