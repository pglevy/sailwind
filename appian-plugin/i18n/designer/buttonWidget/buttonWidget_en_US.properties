# Appian designer-translation bundle (default en_US) for the Button component.
# Convention: Appian Component Plug-in internationalization bundle.
#   name / description               -> the component itself
#   parameter.<name>.name            -> parameter friendly name
#   parameter.<name>.description      -> parameter description
# See ../README.md for scope, key convention, and assumptions.
# Note: the React-only alias "onClick" and the non-SAIL "className" prop are
# intentionally omitted (see ../README.md).

# Component
name=Button
description=A clickable button that triggers an action or saves a value. Supports styling, sizing, icons, validation, and an optional confirmation dialog.

# Parameters
parameter.label.name=Label
parameter.label.description=Text to display on the button. Optional.

parameter.style.name=Style
parameter.style.description=Determines the button's appearance. Optional. Valid values include "SOLID", "OUTLINE", and "LINK".

parameter.color.name=Color
parameter.color.description=Determines the button color. Optional. Accepts a hex value, a semantic token (e.g. "ACCENT", "SECONDARY", "NEGATIVE"), or a palette token (e.g. "TEAL_700").

parameter.size.name=Size
parameter.size.description=Determines the size of the button. Optional. Valid values: "SMALL", "STANDARD", "MEDIUM", "LARGE".

parameter.width.name=Width
parameter.width.description=Determines the button width. Optional. Valid values include "MINIMIZE" and "FILL".

parameter.disabled.name=Disabled
parameter.disabled.description=Prevents the user from clicking the button. Optional; default false.

parameter.submit.name=Submit
parameter.submit.description=Whether this button submits the enclosing form. Optional; default false.

parameter.validate.name=Validate
parameter.validate.description=Determines whether the button performs validation before its action runs. Optional; default false.

parameter.validationGroup.name=Validation Group
parameter.validationGroup.description=Identifier of the validation group evaluated when Validate is true. Optional.

parameter.confirmMessage.name=Confirm Message
parameter.confirmMessage.description=Body text of the confirmation dialog shown before the action runs. Optional. When set, a confirmation dialog is presented.

parameter.confirmHeader.name=Confirm Header
parameter.confirmHeader.description=Header text of the confirmation dialog. Optional.

parameter.confirmButtonLabel.name=Confirm Button Label
parameter.confirmButtonLabel.description=Label for the confirm action in the confirmation dialog. Optional.

parameter.cancelButtonLabel.name=Cancel Button Label
parameter.cancelButtonLabel.description=Label for the cancel action in the confirmation dialog. Optional.

parameter.showWhen.name=Show When
parameter.showWhen.description=Whether the button is displayed. Optional; default true. When false, the component renders nothing.

parameter.icon.name=Icon
parameter.icon.description=Name of the icon to display on the button. Optional.

parameter.iconPosition.name=Icon Position
parameter.iconPosition.description=Position of the icon relative to the label. Optional. Valid values: "START", "END".

parameter.accessibilityText.name=Accessibility Text
parameter.accessibilityText.description=Additional text announced by screen readers. Optional.

parameter.tooltip.name=Tooltip
parameter.tooltip.description=Text shown on hover. Optional.

parameter.loadingIndicator.name=Loading Indicator
parameter.loadingIndicator.description=Whether a loading indicator is shown while the button's action is in progress. Optional; default false.

parameter.value.name=Value
parameter.value.description=Value associated with this button, passed to Save Into when the button is pressed. Optional.

parameter.saveInto.name=Save Into
parameter.saveInto.description=One or more variables updated when the button is pressed. Receives the button's Value.
