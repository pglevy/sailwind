# Appian designer-translation bundle (default en_US) for the Read-Only Grid component.
# Convention: Appian Component Plug-in internationalization bundle.
#   name / description                       -> the component itself
#   parameter.<name>.name / .description      -> input-only / event parameters
#   parameter.<name>Value.name                -> input-output parameter input
#   parameter.<name>SaveInto.name             -> input-output parameter output
# See ../README.md for scope, key convention, and assumptions.
# Note: the library's React "children" columns prop is surfaced here as the SAIL
# "columns" parameter; the non-SAIL "className" prop is intentionally omitted.

# Component
name=Read-Only Grid
description=Displays tabular data in a non-editable grid with sorting, paging, optional row selection, and configurable spacing and borders.

# Parameters
parameter.label.name=Label
parameter.label.description=Text to display as the grid label. Optional.

parameter.labelPosition.name=Label Position
parameter.labelPosition.description=Determines where the label appears. Optional; default "ABOVE". Valid values: "ABOVE", "ADJACENT", "JUSTIFIED", "COLLAPSED".

parameter.instructions.name=Instructions
parameter.instructions.description=Supplemental text about this grid. Optional.

parameter.helpTooltip.name=Help Tooltip
parameter.helpTooltip.description=Help text shown in a tooltip next to the label. Optional.

parameter.emptyGridMessage.name=Empty Grid Message
parameter.emptyGridMessage.description=Text shown when there is no data to display. Optional; when omitted, a localized library default is shown.

parameter.data.name=Data
parameter.data.description=The array of records to display in the grid. Optional.

parameter.columns.name=Columns
parameter.columns.description=The column definitions for the grid (provided in the library via child Grid Column components). Optional.

parameter.pageSize.name=Page Size
parameter.pageSize.description=Maximum number of rows shown per page. Optional; default 10.

parameter.initialSorts.name=Initial Sorts
parameter.initialSorts.description=Initial sort configuration applied to the grid. Optional. Each entry names a field and a direction.

parameter.selectable.name=Selectable
parameter.selectable.description=Whether rows can be selected. Optional; default false.

parameter.selectionStyle.name=Selection Style
parameter.selectionStyle.description=Visual style used to indicate selection. Optional. Valid values: "CHECKBOX", "ROW_HIGHLIGHT", "CHECKBOX_SUBTLE_HIGHLIGHT", "SUBTLE_HIGHLIGHT".

parameter.selectionValue.name=Selection
parameter.selectionSaveInto.name=Save Selection
parameter.selection.description=The identifiers of the currently selected rows. Read from Selection and updated through Save Selection when the user changes the selection.

parameter.validations.name=Validations
parameter.validations.description=Validation messages to display below the grid. Optional.

parameter.showWhen.name=Show When
parameter.showWhen.description=Whether the component is displayed. Optional; default true. When false, the component renders nothing.

parameter.spacing.name=Spacing
parameter.spacing.description=Cell spacing density. Optional; default "STANDARD". Valid values: "STANDARD", "DENSE".

parameter.height.name=Height
parameter.height.description=The height of the grid. Optional.

parameter.borderStyle.name=Border Style
parameter.borderStyle.description=Border style of the grid. Optional; default "STANDARD". Valid values: "STANDARD", "LIGHT".

parameter.shadeAlternateRows.name=Shade Alternate Rows
parameter.shadeAlternateRows.description=Whether alternate rows are shaded for readability. Optional; default true.

parameter.rowHeader.name=Row Header
parameter.rowHeader.description=Index of the column used as the row header for accessibility. Optional.

parameter.accessibilityText.name=Accessibility Text
parameter.accessibilityText.description=Additional text announced by screen readers. Optional.

parameter.marginAbove.name=Margin Above
parameter.marginAbove.description=Space added above the component. Optional; default "NONE". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".

parameter.marginBelow.name=Margin Below
parameter.marginBelow.description=Space added below the component. Optional; default "STANDARD". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".

parameter.pagingControls.name=Paging Controls
parameter.pagingControls.description=Determines which paging controls appear. Optional; default "STANDARD". Valid values: "STANDARD" (hides total count for performance) and "ROW_COUNT" (shows total count and first/last controls).
