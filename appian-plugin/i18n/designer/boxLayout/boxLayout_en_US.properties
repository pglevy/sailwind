# Appian designer-translation bundle (default en_US) for the BoxLayout component.
# Convention: Appian Component Plug-in internationalization bundle.
#   name / description               -> the component itself
#   parameter.<name>.name            -> parameter friendly name
#   parameter.<name>.description      -> parameter description
# See ../README.md for scope, key convention, and assumptions.

# Component
name=Box Layout
description=Displays content in a bordered box with an optional header title and expand/collapse control.

# Parameters
parameter.label.name=Label
parameter.label.description=Text to display as the box's title. Optional.

parameter.contents.name=Contents
parameter.contents.description=Components and layouts to display within the box. Optional.

parameter.style.name=Style
parameter.style.description=Determines the box header color. If set to "INFO" or "ERROR", it also affects the border and label text colors. Optional; default "STANDARD". Valid values: any hex color (with optional 2-digit alpha), or "STANDARD", "ACCENT", "SUCCESS", "INFO", "WARN", "ERROR".

parameter.showWhen.name=Show When
parameter.showWhen.description=Determines whether the layout is displayed on the interface. Optional; default true. When false, the layout is hidden and is not evaluated.

parameter.isCollapsible.name=Collapsible
parameter.isCollapsible.description=Determines if an expand/collapse control appears in the box header. Optional; default false.

parameter.isInitiallyCollapsed.name=Initially Collapsed
parameter.isInitiallyCollapsed.description=Determines if the box is collapsed when the interface first loads. Optional; default false.

parameter.marginBelow.name=Margin Below
parameter.marginBelow.description=Determines how much space is added below the layout. Optional; default "NONE". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".

parameter.accessibilityText.name=Accessibility Text
parameter.accessibilityText.description=Additional text to be announced by screen readers. Optional. Used only for accessibility; produces no visible change.

parameter.padding.name=Padding
parameter.padding.description=Determines the space between the box edges and its contents. Optional; default "LESS". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".

parameter.shape.name=Shape
parameter.shape.description=Determines the box shape. Optional; default "SQUARED". Valid values: "SQUARED", "SEMI_ROUNDED", "ROUNDED".

parameter.marginAbove.name=Margin Above
parameter.marginAbove.description=Determines how much space is added above the layout. Optional; default "NONE". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".

parameter.showBorder.name=Show Border
parameter.showBorder.description=Determines whether the layout has an outer border. Optional; default true.

parameter.showShadow.name=Show Shadow
parameter.showShadow.description=Determines whether the layout has an outer shadow. Optional; default false.

parameter.labelSize.name=Label Size
parameter.labelSize.description=Determines the label size. Optional; default "EXTRA_SMALL". Valid values: "LARGE_PLUS", "LARGE", "MEDIUM_PLUS", "MEDIUM", "SMALL", "EXTRA_SMALL".

parameter.labelHeadingTag.name=Accessibility Heading Tag
parameter.labelHeadingTag.description=Determines the heading tag associated with the label for use by screen readers. Optional; produces no visible change. Valid values: "H1", "H2", "H3", "H4", "H5", "H6". Default depends on the chosen label size.

parameter.borderWeight.name=Border Weight
parameter.borderWeight.description=Determines the box border thickness. Optional; default "THIN". Valid values: "THIN", "MEDIUM", "THICK".

parameter.borderColor.name=Border Color
parameter.borderColor.description=Determines the border color. Optional; default "STANDARD". Valid values: any hex color (with optional 2-digit alpha), or "STANDARD", "ACCENT", "POSITIVE", "WARN", "NEGATIVE", "INFO". If Style is "INFO" or "ERROR", the default border color matches the Style color.

parameter.labelFontWeight.name=Label Font Weight
parameter.labelFontWeight.description=Determines the font weight of the label. Optional; default "SEMI_BOLD". Valid values: "LIGHT", "REGULAR", "SEMI_BOLD", "BOLD".
