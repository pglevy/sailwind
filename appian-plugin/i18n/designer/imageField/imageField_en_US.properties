# Appian designer-translation bundle (default en_US) for the Image component.
# Convention: Appian Component Plug-in internationalization bundle.
#   name / description               -> the component itself
#   parameter.<name>.name            -> parameter friendly name
#   parameter.<name>.description      -> parameter description
# See ../README.md for scope, key convention, and assumptions.

# Component
name=Image
description=Displays one or more images from document management or the web, with optional labels, sizing, cropping, and thumbnail enlargement.

# Parameters
parameter.label.name=Label
parameter.label.description=Text to display as the field label. Optional.

parameter.labelPosition.name=Label Position
parameter.labelPosition.description=Determines where the label appears. Optional; default "ABOVE". Valid values: "ABOVE", "ADJACENT", "JUSTIFIED", "COLLAPSED".

parameter.instructions.name=Instructions
parameter.instructions.description=Supplemental text about this field. Optional.

parameter.helpTooltip.name=Help Tooltip
parameter.helpTooltip.description=Help text shown in a tooltip next to the label (max 500 characters). Optional.

parameter.images.name=Images
parameter.images.description=The array of images to display. Required. Supports both document images and user images.

parameter.showWhen.name=Show When
parameter.showWhen.description=Whether the component is displayed. Optional; default true. When false, the component renders nothing.

parameter.size.name=Size
parameter.size.description=Determines how the images are sized. Optional; default "MEDIUM". Valid values include "ICON", "TINY", "SMALL", "MEDIUM", "LARGE", "GALLERY", and "FIT".

parameter.isThumbnail.name=Is Thumbnail
parameter.isThumbnail.description=Whether images can be viewed larger when clicked. Optional; default false.

parameter.style.name=Style
parameter.style.description=Determines how the images are rendered. Optional; default "STANDARD". Valid values: "STANDARD", "AVATAR".

parameter.shape.name=Shape
parameter.shape.description=Determines the border radius of the images. Optional; default "SEMI_ROUNDED". Ignored when Style is "AVATAR" (always circular). Valid values: "SQUARED", "SEMI_ROUNDED", "ROUNDED".

parameter.align.name=Alignment
parameter.align.description=Determines the horizontal alignment of the images. Optional; default "START". Valid values: "START", "CENTER", "END".

parameter.accessibilityText.name=Accessibility Text
parameter.accessibilityText.description=Additional text announced by screen readers. Optional.

parameter.marginAbove.name=Margin Above
parameter.marginAbove.description=Space added above the component. Optional; default "NONE". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".

parameter.marginBelow.name=Margin Below
parameter.marginBelow.description=Space added below the component. Optional; default "STANDARD". Valid values: "NONE", "EVEN_LESS", "LESS", "STANDARD", "MORE", "EVEN_MORE".
