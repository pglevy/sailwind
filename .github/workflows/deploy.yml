name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where apt mirrors fail to resolve during
    # `playwright install --with-deps`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # No --with-deps: its apt-get step fails when the runner can't resolve the Ubuntu
      # mirrors. The runner image already ships the system libraries Chromium needs.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm run generate:css
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
      - run: pnpm run validate:designer-bundles
      - run: pnpm run build:lib
      # Generated files (public/tokens.json, src/index.css, palette types) are
      # committed. If the build changed any tracked file, the committed copy is stale.
      - name: Check generated files are up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::The build changed tracked files. Run 'pnpm run build:lib' locally and commit the result."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build-storybook
      # Assemble the final Pages site:
      #   /           → landing page (homepage.html)
      #   /components → Storybook
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/components
          cp homepage.html pages/index.html
          cp -r storybook-static/. pages/components/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./pages

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
