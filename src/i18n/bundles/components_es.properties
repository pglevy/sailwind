# Sailwind Spanish (es) component strings — SMOKE-TEST FIXTURE.
#
# Illustrative translations for manually smoke-testing locale switching in
# Storybook. NOT professionally reviewed. `es` is registered in SUPPORTED_LOCALES
# as a temporary fixture (v1 officially ships en-US only). Language-only `es`
# serves es, es-ES, es-MX, etc. via the language-only fallback tier.

# Paging controls
paging.firstPage=Primera página
paging.previousPage=Página anterior
paging.nextPage=Página siguiente
paging.lastPage=Última página
paging.range={0} de {1}
paging.rangeMany={0} de muchos
paging.numberRange={0} \u2013 {1}

# Button
button.loading=cargando

# Field label (help / required indicators)
field.help=ayuda
field.required=obligatorio

# Progress bar
progressBar.label=Progreso

# Image
image.openLinked=Abrir imagen vinculada

# Read-only grid
grid.emptyMessage=No hay elementos disponibles
