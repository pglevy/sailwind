# Sailwind default (en-US) component strings.
#
# These values are byte-for-byte identical to the current hardcoded English
# literals in the component source, so that with no LocaleProvider present every
# component renders exactly as it does today (Requirement 5). This suffix-less
# bundle is keyed under the Default_Locale (en-us) by the loader (Requirement 3.6).
#
# Paging uses full-phrase interpolated keys ({0}/{1}) rather than concatenation
# so the phrase stays translatable. The bold "start – end" number-range is its
# own substitutable unit (paging.numberRange) that gets interpolated as a single
# React node into paging.range / paging.rangeMany, so one translatable phrase
# controls word order AND the range keeps its bold styling. \u2013 is the en dash
# used in the "{start} – {end}" rendering and is decoded by the bundle loader.

# Paging controls
paging.firstPage=First page
paging.previousPage=Previous page
paging.nextPage=Next page
paging.lastPage=Last page
paging.range={0} of {1}
paging.rangeMany={0} of many
paging.numberRange={0} \u2013 {1}

# Button
button.loading=loading

# Field label (help / required indicators)
field.help=help
field.required=required

# Progress bar
progressBar.label=Progress

# Image
image.openLinked=Open linked image

# Read-only grid
grid.emptyMessage=No items available
